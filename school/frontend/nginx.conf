# GPU 算力平台 Frontend - Nginx 設定
# 提供 React SPA 靜態檔，並把 /api 請求反向代理到 backend service

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 基本安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 靜態資源長快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /health 直接通給 backend，方便外部監控
    location = /health {
        proxy_pass http://backend:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API 反向代理：/api/* → backend:4000/api/*
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 較長 timeout，讓 OpenNebula 代理請求有空間
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket 升級（保留彈性）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback：所有未命中的路徑回 index.html，由 React Router 處理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
