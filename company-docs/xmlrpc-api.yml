            type: integer
        - in: query
          name: image
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful response

  /template/instantiate/{id}:
    put:
      tags: [template]
      summary: 從 Template 建立 VM（GPU 算力平台主要入口）
      operationId: template_instantiate
      x-xmlrpc-method: template.instantiate
      description: GPU 算力平台建立 VM 的主要方式。可透過 template 參數覆蓋 GPU/PCI 設定。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: VM 名稱
                hold:
                  type: boolean
                  default: false
                  description: 是否以 HOLD 狀態建立
                template:
                  type: string
                  description: 額外的 template 覆蓋（如 PCI、SCHED_REQUIREMENTS）
                persistent:
                  type: boolean
                  default: false
      responses:
        "200":
          description: 回傳新建 VM 的 ID

