          DEVICE_NAME（如 "NVIDIA Corporation AD104 [GeForce RTX 4070 Ti]"）
          CLASS_NAME, VMID（哪台 VM 在用，-1 為空閒）
        - HOST.HOST_SHARE.NUMA_NODES.NODE[]: NUMA 拓撲，含 CORE/HUGEPAGE
