openapi: 3.0.3
info:
  title: OpenNebula FireEdge XML-RPC Proxy API
  version: 1.0.0
  description: |
    FireEdge XML-RPC 代理路由完整文件。
    這些路由由 src/fireedge/src/server/routes/entrypoints/Api/xmlrpc.js 動態產生，
    直接代理 OpenNebula 核心 XML-RPC API。
    URL 前綴: /fireedge/api
    認證方式: 所有端點均需 FireedgeCookie (session token)。
    來源定義: src/fireedge/src/server/utils/constants/commands/*.js
servers:
  - url: /fireedge/api
    description: Default FireEdge API base path
  - url: /api
    description: Direct API base path
components:
  securitySchemes:
    FireedgeCookie:
      type: apiKey
      in: cookie
      name: FireedgeToken
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登入後用 POST /auth/ 取得 token（在 response.data.token），
        後續請求帶 Authorization: Bearer <token> 即可。
        實測學校環境用此方式較穩定。
  schemas:
    ChmodParams:
      type: object
      properties:
        ownerUse:
          type: integer
          default: -1
        ownerManage:
          type: integer
          default: -1
        ownerAdmin:
          type: integer
          default: -1
        groupUse:
          type: integer
          default: -1
        groupManage:
          type: integer
          default: -1
        groupAdmin:
          type: integer
          default: -1
        otherUse:
          type: integer
          default: -1
        otherManage:
          type: integer
          default: -1
        otherAdmin:
          type: integer
          default: -1
    ChownParams:
      type: object
      properties:
        user:
          type: integer
          default: -1
        group:
          type: integer
          default: -1
security:
  - FireedgeCookie: []
  - BearerAuth: []

paths:
  # ============================================================
  # VM - 虛擬機器 (46 個端點)
  # ============================================================
  /vm/allocate:
    put:
      tags: [vm]
      summary: 建立 VM (raw template)
      operationId: vm_allocate
      x-xmlrpc-method: vm.allocate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: VM template 內容
                status:
                  type: boolean
                  default: false
                  description: 是否以 HOLD 狀態建立
      responses:
        "200":
          description: 回傳新建 VM 的 ID

  /vm/deploy/{id}:
    put:
      tags: [vm]
      summary: 部署 VM 到指定 Host
      operationId: vm_deploy
      x-xmlrpc-method: vm.deploy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: integer
                  default: -1
                  description: 目標 Host ID
                enforce:
                  type: boolean
                  default: false
                  description: 是否強制部署（忽略排程限制）
                datastore:
                  type: integer
                  default: -1
                  description: 目標 Datastore ID
      responses:
        "200":
          description: Successful response

  /vm/action/{id}:
    put:
      tags: [vm]
      summary: 執行 VM 生命週期動作
      operationId: vm_action
      x-xmlrpc-method: vm.action
      description: |
        可用的 action 值:
        - terminate: 正常關機並刪除
        - terminate-hard: 強制關機並刪除
        - poweroff: 正常關機（保留資源）
        - poweroff-hard: 強制關機（保留資源）
        - reboot: 正常重啟
        - reboot-hard: 強制重啟
        - hold: 暫停排程
        - release: 恢復排程
        - stop: 停止（儲存狀態到磁碟）
        - suspend: 暫停（儲存狀態到記憶體）
        - resume: 恢復運行
        - resched: 重新排程
        - unresched: 取消重新排程
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  default: stop
                  enum: [terminate, terminate-hard, poweroff, poweroff-hard, reboot, reboot-hard, hold, release, stop, suspend, resume, resched, unresched]
      responses:
        "200":
          description: Successful response

  /vm/migrate/{id}:
    put:
      tags: [vm]
      summary: 遷移 VM 到其他 Host
      operationId: vm_migrate
      x-xmlrpc-method: vm.migrate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: integer
                  default: -1
                live:
                  type: boolean
                  default: false
                  description: 是否即時遷移
                enforce:
                  type: boolean
                  default: false
                datastore:
                  type: integer
                  default: -1
                type:
                  type: integer
                  default: 0
                  description: "0=遷移, 1=RDMA遷移"
      responses:
        "200":
          description: Successful response

  /vm/disksaveas/{id}:
    put:
      tags: [vm]
      summary: 將 VM 磁碟儲存為映像
      operationId: vm_disksaveas
      x-xmlrpc-method: vm.disksaveas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: integer
                  default: 0
                name:
                  type: string
                type:
                  type: string
                snapshot:
                  type: integer
                  default: -1
      responses:
        "200":
          description: Successful response

  /vm/disksnapshotcreate/{id}:
    post:
      tags: [vm]
      summary: 建立磁碟快照
      operationId: vm_disksnapshotcreate
      x-xmlrpc-method: vm.disksnapshotcreate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: integer
                  default: 0
                name:
                  type: string
      responses:
        "200":
          description: Successful response

  /vm/disksnapshotdelete/{id}:
    delete:
      tags: [vm]
      summary: 刪除磁碟快照
      operationId: vm_disksnapshotdelete
      x-xmlrpc-method: vm.disksnapshotdelete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: disk
          schema:
            type: integer
            default: 0
        - in: query
          name: snapshot
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Successful response

  /vm/disksnapshotrevert/{id}:
    put:
      tags: [vm]
      summary: 還原磁碟快照
      operationId: vm_disksnapshotrevert
      x-xmlrpc-method: vm.disksnapshotrevert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: integer
                  default: 0
                snapshot:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/disksnapshotrename/{id}:
    put:
      tags: [vm]
      summary: 重命名磁碟快照
      operationId: vm_disksnapshotrename
      x-xmlrpc-method: vm.disksnapshotrename
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: integer
                  default: 0
                snapshot:
                  type: integer
                  default: 0
                name:
                  type: string
      responses:
        "200":
          description: Successful response

  /vm/attach/{id}:
    put:
      tags: [vm]
      summary: 掛載磁碟到 VM
      operationId: vm_attach
      x-xmlrpc-method: vm.attach
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: DISK vector attribute (XML)
      responses:
        "200":
          description: Successful response

  /vm/detach/{id}:
    put:
      tags: [vm]
      summary: 卸載磁碟
      operationId: vm_detach
      x-xmlrpc-method: vm.detach
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/diskresize/{id}:
    put:
      tags: [vm]
      summary: 調整磁碟大小
      operationId: vm_diskresize
      x-xmlrpc-method: vm.diskresize
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disk:
                  type: integer
                  default: 0
                size:
                  type: string
                  description: 新大小 (MB)
      responses:
        "200":
          description: Successful response

  /vm/attachnic/{id}:
    put:
      tags: [vm]
      summary: 掛載網卡到 VM（取得網路/IP）
      operationId: vm_attachnic
      x-xmlrpc-method: vm.attachnic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: NIC vector attribute (XML)
      responses:
        "200":
          description: Successful response

  /vm/detachnic/{id}:
    put:
      tags: [vm]
      summary: 卸載網卡
      operationId: vm_detachnic
      x-xmlrpc-method: vm.detachnic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nic:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/updatenic/{id}:
    put:
      tags: [vm]
      summary: 更新網卡設定
      operationId: vm_updatenic
      x-xmlrpc-method: vm.updatenic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nic:
                  type: integer
                  default: 0
                template:
                  type: string
                append:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/attachsg/{id}:
    put:
      tags: [vm]
      summary: 掛載安全群組到 NIC
      operationId: vm_attachsg
      x-xmlrpc-method: vm.attachsg
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nic:
                  type: integer
                  default: 0
                secgroup:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/detachsg/{id}:
    put:
      tags: [vm]
      summary: 卸載安全群組
      operationId: vm_detachsg
      x-xmlrpc-method: vm.detachsg
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nic:
                  type: integer
                  default: 0
                secgroup:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/attachpci/{id}:
    put:
      tags: [vm]
      summary: 掛載 PCI 裝置（GPU passthrough）
      operationId: vm_attachpci
      x-xmlrpc-method: vm.attachpci
      description: 將 PCI 裝置（如 GPU）直通掛載到 VM。GPU 算力平台核心功能。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: PCI vector attribute (XML)，例如 VENDOR=10de, CLASS=0300
      responses:
        "200":
          description: Successful response

  /vm/detachpci/{id}:
    put:
      tags: [vm]
      summary: 卸載 PCI 裝置（GPU）
      operationId: vm_detachpci
      x-xmlrpc-method: vm.detachpci
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pci:
                  type: integer
                  default: 0
                  description: PCI 裝置 ID
      responses:
        "200":
          description: Successful response

  /vm/chmod/{id}:
    put:
      tags: [vm]
      summary: 修改 VM 權限
      operationId: vm_chmod
      x-xmlrpc-method: vm.chmod
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChmodParams"
      responses:
        "200":
          description: Successful response

  /vm/chown/{id}:
    put:
      tags: [vm]
      summary: 修改 VM 擁有者
      operationId: vm_chown
      x-xmlrpc-method: vm.chown
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChownParams"
      responses:
        "200":
          description: Successful response

  /vm/rename/{id}:
    put:
      tags: [vm]
      summary: 重命名 VM
      operationId: vm_rename
      x-xmlrpc-method: vm.rename
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Successful response

  /vm/snapshotcreate/{id}:
    post:
      tags: [vm]
      summary: 建立 VM 快照
      operationId: vm_snapshotcreate
      x-xmlrpc-method: vm.snapshotcreate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Successful response

  /vm/snapshotrevert/{id}:
    post:
      tags: [vm]
      summary: 還原 VM 快照
      operationId: vm_snapshotrevert
      x-xmlrpc-method: vm.snapshotrevert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot:
                  type: integer
                  default: 0
      responses:
        "200":
          description: Successful response

  /vm/snapshotdelete/{id}:
    delete:
      tags: [vm]
      summary: 刪除 VM 快照
      operationId: vm_snapshotdelete
      x-xmlrpc-method: vm.snapshotdelete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: snapshot
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Successful response

  /vm/resize/{id}:
    put:
      tags: [vm]
      summary: 調整 VM 規格（CPU/記憶體）
      operationId: vm_resize
      x-xmlrpc-method: vm.resize
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: 包含 CPU/VCPU/MEMORY 的 template
                enforce:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Successful response

  /vm/update/{id}:
    put:
      tags: [vm]
      summary: 更新 VM 的使用者 template
      operationId: vm_update
      x-xmlrpc-method: vm.update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                replace:
                  type: integer
                  default: 0
                  description: "0=merge, 1=replace"
      responses:
        "200":
          description: Successful response

  /vm/updateconf/{id}:
    put:
      tags: [vm]
      summary: 更新 VM 配置屬性
      operationId: vm_updateconf
      x-xmlrpc-method: vm.updateconf
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                replace:
                  type: integer
                  default: 1
      responses:
        "200":
          description: Successful response

  /vm/recover/{id}:
    put:
      tags: [vm]
      summary: 復原卡住的 VM
      operationId: vm_recover
      x-xmlrpc-method: vm.recover
      description: |
        operation 值:
        - 0: failure
        - 1: success
        - 2: retry
        - 3: delete
        - 4: delete-recreate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: integer
                  default: 1
      responses:
        "200":
          description: Successful response

  /vm/restore:
    post:
      tags: [vm]
      summary: 從備份還原 VM
      operationId: vm_restore
      x-xmlrpc-method: vm.restore
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: -1
                imageId:
                  type: integer
                  default: -1
                incrementId:
                  type: integer
                  default: -1
                diskId:
                  type: integer
                  default: -1
      responses:
        "200":
          description: Successful response

  /vm/info/{id}:
    get:
      tags: [vm]
      summary: 取得 VM 詳細資訊（含 NIC IP、PCI GPU、CONTEXT）
      operationId: vm_info
      x-xmlrpc-method: vm.info
      description: |
        取得 VM 詳細資訊。回傳的物件包含：
        - VM.TEMPLATE.PCI[]: GPU passthrough 配置請求
        - VM.TEMPLATE.NIC[]: 網路卡配置（DHCP 模式下無 IP）
        - VM.TEMPLATE.CONTEXT: cloud-init 設定（含 SSH_PUBLIC_KEY）
        - VM.MONITORING: 即時監控資料，**含原生 GPU 監控欄位**：
          GPU_COUNT, GPU_UTILIZATION, GPU_MEMORY_FREE, GPU_MEMORY_UTILIZATION,
          GPU_POWER_USAGE，每個還有 _FORECAST 預測版本
        - VM.HISTORY_RECORDS: 歷史部署紀錄（HOSTNAME 在這）
        GPU 算力平台核心 API。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: decrypt
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 回傳 VM 完整資訊物件
          content:
            application/json:
              example:
                id: 200
                message: "OK"
                data:
                  VM:
                    ID: "0"
                    UID: "0"
                    GID: "0"
                    UNAME: "oneadmin"
                    GNAME: "oneadmin"
                    NAME: "Ubuntu 2404-GPU -0"
                    STATE: "3"
                    LCM_STATE: "3"
                    STIME: "1774615796"
                    ETIME: "0"
                    DEPLOY_ID: "3e23434b-4b09-449a-bbc3-32c005fa7963"
                    MONITORING:
                      CPU: "64.92"
                      CPU_FORECAST: "50.83"
                      GPU_COUNT: "1"
                      GPU_MEMORY_FREE: "11885.0"
                      GPU_MEMORY_FREE_FORECAST: "11885.0"
                      GPU_MEMORY_UTILIZATION: "0.0"
                      GPU_MEMORY_UTILIZATION_FORECAST: "0.0"
                      GPU_POWER_USAGE: "0.0"
                      GPU_POWER_USAGE_FORECAST: "0.0"
                      GPU_UTILIZATION: "0.0"
                      GPU_UTILIZATION_FORECAST: "0.0"
                      MEMORY: "16992056"
                      TIMESTAMP: "1776317077"
                      VM_QEMU_PING: "QEMU Guest Agent monitoring disabled"
                    TEMPLATE:
                      CPU: "4"
                      MEMORY: "16384"
                      VCPU: "4"
                      CONTEXT:
                        ETH0_METHOD: "dhcp"
                        ETH0_IP: ""
                        NETWORK: "YES"
                        SSH_PUBLIC_KEY: "ssh-ed25519 AAAA... root@localhost"
                      NIC:
                        AR_ID: "0"
                        BRIDGE: "onebr3"
                        MAC: "02:00:80:7d:95:da"
                        METHOD: "dhcp"
                        NETWORK: "lan-dhcp-onebr3"
                        NETWORK_ID: "5"
                        NIC_ID: "0"
                        SSH: "YES"
                      PCI:
                        - ADDRESS: "0000:01:00:0"
                          BUS: "01"
                          CLASS: "0300"
                          DEVICE: "2782"
                          VENDOR: "10de"
                          PCI_ID: "0"
                          SHORT_ADDRESS: "01:00.0"
                        - ADDRESS: "0000:01:00:1"
                          BUS: "01"
                          CLASS: "0403"
                          DEVICE: "22bc"
                          VENDOR: "10de"
                          PCI_ID: "1"
                          SHORT_ADDRESS: "01:00.1"
                      TEMPLATE_ID: "1"
                    HISTORY_RECORDS:
                      HISTORY:
                        OID: "0"
                        SEQ: "29"
                        HOSTNAME: "10.1.1.79"
                        HID: "0"
                        CID: "0"
                        VM_MAD: "kvm"

  /vm/monitoring/{id}:
    get:
      tags: [vm]
      summary: 取得 VM 監控紀錄
      operationId: vm_monitoring
      x-xmlrpc-method: vm.monitoring
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
