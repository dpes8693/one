openapi: 3.0.3
info:
  title: OpenNebula FireEdge API
  version: 1.0.0-auto
  description: 由 FireEdge 路由指令定義自動產生的 OpenAPI 文件。
servers:
  - url: /fireedge/api
    description: Default FireEdge API base path
  - url: /api
    description: Direct API base path
components:
  securitySchemes:
    FireedgeCookie:
      type: apiKey
      in: cookie
      name: FireedgeToken
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登入後從 POST /auth/ 的 response.data.token 取得 JWT。
        後續請求帶 Authorization: Bearer <token> 即可訪問所有需要認證的端點。
        實測 cookie 模式在某些環境失效，建議用 Bearer Token。
security:
  - FireedgeCookie: []
  - BearerAuth: []
paths:
  /tfa:
    post:
      tags:
        - 2fa
      summary: 設定雙因素驗證
      operationId: 2fa_tfa_setup_post
      responses:
        "200":
          description: Successful response
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      x-fireedge-action: tfa.setup
      security:
        - FireedgeCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
    get:
      tags:
        - 2fa
      summary: 取得雙因素驗證 QR Code
      operationId: 2fa_tfa_qr_get
      responses:
        "200":
          description: Successful response
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      x-fireedge-action: tfa.qr
      security:
        - FireedgeCookie: []
    delete:
      tags:
        - 2fa
      summary: 刪除雙因素驗證設定
      operationId: 2fa_tfa_delete_delete
      responses:
        "200":
          description: Successful response
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      x-fireedge-action: tfa.delete
      security:
        - FireedgeCookie: []
  /auth/:
    post:
      tags:
        - auth
      summary: 使用帳號登入系統
      description: |
        登入端點。成功回傳 token 在 response.data.token。
        之後可用兩種方式認證：
        1. Cookie: FireedgeToken={"token":"<token>"} (httpOnly cookie，瀏覽器自動處理)
        2. Header: Authorization: Bearer <token> (推薦給 API 呼叫使用)
      operationId: auth_authentication_post
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              example:
                id: 200
                message: "OK"
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiIwIiwic3ViIjoib25lYWRtaW4iLCJpYXQiOjE3MTk1MDAwMDAsImV4cCI6MTcxOTUwMzYwMH0.example"
                  id: "0"
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      x-fireedge-action: authentication
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                token:
                  type: string
                type:
                  type: string
                tfatoken:
                  type: string
                remember:
                  type: string
  /auth/logout:
    post:
      tags:
        - auth
      summary: 登出目前帳號
      operationId: auth_logout_post
      responses:
        "200":
          description: Successful response
        "401":
          description: Unauthorized
